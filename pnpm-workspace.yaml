# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the project vulnerable to supply-chain
# attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packages, react from Meta, typescript from Microsoft).
# Even then, remove the exclusion once the 1-day window has passed.
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'

# Shared dependency versions, referenced as `catalog:` from package.json so the
# versions live in one place.
catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  clsx: ^2.1.1
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  vite: ^7.3.2

autoInstallPeers: false

overrides:
  # NOTE: the original Replit config deleted every non-Linux native package
  # (esbuild/rollup/lightningcss/@tailwindcss/oxide binaries for macOS, Windows,
  # etc.) to shrink the deployed image. Authoring "X>Y": "-" removes those
  # optional dependencies outright, which breaks local development off Linux —
  # e.g. Vite fails with "Cannot find module @rollup/rollup-win32-x64-msvc".
  # Keep only genuine version pins/sec fixes here; never strip platform binaries.
  #
  # One esbuild version across the toolchain (Vite and its plugins pull it in
  # at different ranges).
  esbuild: '0.28.2'

allowBuilds:
  # Neither package needs to run a script to work: esbuild ships prebuilt
  # platform binaries, and tesseract.js's only postinstall is a funding banner.
  esbuild: false
  tesseract.js: false
