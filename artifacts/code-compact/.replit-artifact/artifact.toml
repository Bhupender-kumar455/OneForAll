kind = "web"
previewPath = "/"
title = "Code Formatter"
description = "A fast, local-first code formatter and beautifier. Paste code, pick a language, and get consistently formatted output, with an optional minify mode."
version = "1.0.0"
id = "artifacts/code-compact"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23084

[services.development]
run = "pnpm --filter @workspace/code-compact run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-compact", "run", "build" ]
serve = "static"
publicDir = "artifacts/code-compact/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23084"
BASE_PATH = "/"
