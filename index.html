<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Code Formatter &amp; Beautifier</title>
    <meta name="description" content="Format and beautify code in your browser across JavaScript, TypeScript, JSON, CSS, HTML, SQL, Python, C and more. Nothing is uploaded." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Code Formatter &amp; Beautifier" />
    <meta property="og:description" content="Format and beautify code in your browser across dozens of languages. Nothing is uploaded." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Code Formatter &amp; Beautifier" />
    <meta name="twitter:description" content="Format and beautify code in your browser across dozens of languages. Nothing is uploaded." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Set before the bundle runs: without this, a dark-mode visit paints the
      default light page until React mounts. The app then adopts the same value
      from `@/lib/theme`, which is the one place the theme is written after this.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cc-theme");
          const dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* Storage can be blocked; the app falls back to the OS setting. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
